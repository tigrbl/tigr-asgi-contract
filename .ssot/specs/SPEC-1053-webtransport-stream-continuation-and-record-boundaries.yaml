summary: "WebTransport stream continuation is independent of application-record completion. Stream send and receive events carry explicit continuation state. JSON-RPC over a persistent stream uses a declared uint32 big-endian length prefix, supports fragmented and coalesced records, enforces a bounded record size before allocation, and rejects an incomplete terminal record. A complete record may be emitted while the stream remains open."

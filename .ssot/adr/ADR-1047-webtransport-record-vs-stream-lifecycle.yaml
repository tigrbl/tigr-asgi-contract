summary: "A complete JSON-RPC or other application record is independent of WebTransport stream lifecycle. The more field is explicit carrier continuation state: true keeps the sending direction open and false terminates it with FIN. Absence must not default to termination. jsonrpc_complete and equivalent record-completion metadata never imply FIN. webtransport.stream.close remains the explicit stream lifecycle operation."
